# Deep navy and teal, with amber used in the page styling. The colours are set inside each theme block, because colours at the
# top level of [theme] would lock the app to light; this way it follows the viewer's light or dark setting.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#0E7C86"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF1F5"
textColor = "#0B1F33"

[theme.dark]
primaryColor = "#3FC1B8"
backgroundColor = "#0B1F33"
secondaryBackgroundColor = "#12304A"
textColor = "#E8EEF4"

[server]
headless = true

[browser]
gatherUsageStats = false
